<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>游戏音效试听</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #080d12;
        color: #eef7fb;
      }

      body {
        width: min(760px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0 64px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      header p,
      article p,
      footer {
        color: #91a4af;
      }

      section {
        margin-top: 32px;
      }

      h2 {
        margin-bottom: 12px;
        color: #55e8ff;
        font-size: 18px;
      }

      .choices {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      article {
        padding: 16px;
        border: 1px solid #253640;
        border-radius: 6px;
        background: #0d151b;
      }

      strong {
        display: block;
        margin-bottom: 5px;
      }

      article p {
        min-height: 38px;
        margin: 0 0 14px;
        font-size: 13px;
        line-height: 1.5;
      }

      audio {
        width: 100%;
        height: 36px;
      }

      footer {
        margin-top: 32px;
        font-size: 12px;
      }

      @media (max-width: 560px) {
        .choices {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>游戏音效试听</h1>
      <p>当前采用的游戏音效与备用候选。</p>
    </header>

    <section>
      <h2>攻击</h2>
      <div class="choices">
        <article>
          <strong>已采用 · 重型剑击</strong>
          <p>从 Artninja 的剑击素材中截取的单次攻击音效。</p>
          <audio controls src="../attack-sword.wav"></audio>
        </article>
      </div>
    </section>

    <section>
      <h2>回血</h2>
      <div class="choices">
        <article>
          <strong>已采用 · 治愈魔法 B</strong>
          <p>已接入游戏正式回血音效。</p>
          <audio controls src="../heal-b.wav"></audio>
        </article>
        <article>
          <strong>备用 · 生命恢复</strong>
          <p>较长的魔法恢复音，暂不使用。</p>
          <audio controls src="./oga/health_restore.wav"></audio>
        </article>
      </div>
    </section>

    <section>
      <h2>骰子</h2>
      <div class="choices">
        <article>
          <strong>已采用 · 单骰硬碰撞 B</strong>
          <p>已接入游戏正式掷骰音效。</p>
          <audio controls src="../dice-hit-b.ogg"></audio>
        </article>
        <article>
          <strong>备用 · 多骰落桌</strong>
          <p>多颗骰子同时落下，暂不使用。</p>
          <audio controls src="./kenney/dice-throw-1.ogg"></audio>
        </article>
      </div>
    </section>

    <footer>Attack: Artninja / Freesound · CC BY 4.0. Healing: OpenGameArt · CC0. Dice: Kenney · CC0.</footer>
  </body>
</html>
